# ros_gz_bridge configuration. <robot_name> is replaced by the spawn launch.
# GZ -> ROS truth channels are diagnostic only; no navigation node may consume
# /sim/ground_truth_odometry.
- direction: ROS_TO_GZ
  gz_topic_name: /<robot_name>/cmd_vel
  gz_type_name: ignition.msgs.Twist
  ros_topic_name: /sim/actuator_cmd_vel
  ros_type_name: geometry_msgs/msg/Twist

- direction: GZ_TO_ROS
  gz_topic_name: /<robot_name>/odometry
  gz_type_name: ignition.msgs.Odometry
  ros_topic_name: /sim/ground_truth_odometry
  ros_type_name: nav_msgs/msg/Odometry

- direction: GZ_TO_ROS
  gz_topic_name: /world/default/model/<robot_name>/joint_state
  gz_type_name: ignition.msgs.Model
  ros_topic_name: /joint_states
  ros_type_name: sensor_msgs/msg/JointState

- direction: GZ_TO_ROS
  gz_topic_name: /world/default/model/<robot_name>/link/chassis/sensor/front_rplidar_a2/scan
  gz_type_name: ignition.msgs.LaserScan
  ros_topic_name: /scan
  ros_type_name: sensor_msgs/msg/LaserScan

- direction: GZ_TO_ROS
  gz_topic_name: /world/default/model/<robot_name>/link/<sensor_parent>/sensor/chassis_imu/imu
  gz_type_name: ignition.msgs.IMU
  ros_topic_name: /livox/imu
  ros_type_name: sensor_msgs/msg/Imu

- direction: GZ_TO_ROS
  gz_topic_name: /world/default/model/<robot_name>/link/<sensor_parent>/sensor/navigation_lidar3d/scan/points
  gz_type_name: ignition.msgs.PointCloudPacked
  ros_topic_name: /lidar/points
  ros_type_name: sensor_msgs/msg/PointCloud2

- direction: GZ_TO_ROS
  gz_topic_name: /assessment/body_contacts
  gz_type_name: ignition.msgs.Contacts
  ros_topic_name: /assessment/body_contacts
  ros_type_name: ros_gz_interfaces/msg/Contacts

# Diagnostic only: passive-roller hub encoders from WheelTractionDrive (rollers mode).
- direction: GZ_TO_ROS
  gz_topic_name: /<robot_name>/wheel_odometry
  gz_type_name: ignition.msgs.Odometry
  ros_topic_name: /sim/wheel_odometry
  ros_type_name: nav_msgs/msg/Odometry

